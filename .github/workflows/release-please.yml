name: Release Please

on:
  push:
    branches:
      - dev # Assuming 'dev' is the main branch for this repo based on prior inspection

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update action.yml version
        if: steps.release.outputs.release_created
        run: |
          VERSION="$({{ steps.release.outputs.tag_name }})" # Assuming tag_name is like v1.1.0
          # Remove 'v' prefix from tag_name if it exists
          if [[ "$VERSION" =~ ^v ]]; then
            VERSION="${VERSION:1}"
          fi
          sed -i "s/^\(\s*uses:\s*vln-devsecops\/actions-build-paper@\).*/${VERSION}/" action.yml
          # Optionally comment out or remove existing release workflows if they conflict
          # For now, we assume release-please will create its own release PRs
          git config user.name "OpenClaw"
          git config user.email "openclaw@example.com"
          git add action.yml
          git commit -m "CI: Update action.yml version according to release-please"
          git push origin add-release-please
          gh pr create --base dev --head add-release-please --title "CI: Add release-please automation" --body "This PR adds release-please configuration to automate versioning and releases for action.yml." --repo vln-devsecops/actions-build-paper
